name: Qualify an installed iPhone simulator release
on:
  workflow_call:
    inputs:
      build_run:
        type: string
        required: true
      archive_sha256:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      build_run:
        description: Completed configured iOS build run in this repository
        required: true
      archive_sha256:
        description: The released simulator tar.gz checksum
        required: true
permissions:
  contents: read
  actions: read
jobs:
  installed-ios-account:
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: pasofi-frontend/mobile
    env:
      BUILD_RUN: ${{ inputs.build_run }}
      ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Download the release candidate and verify its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          check="$RUNNER_TEMP/pasofi-installed-client"
          mkdir -p "$check/package" "$check/download"
          [[ "$BUILD_RUN" =~ ^[0-9]+$ && "$ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          actual_source=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq '.head_sha')
          if [ "$actual_source" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Installed iOS acceptance cannot validate a stale release: artifact run $BUILD_RUN built $actual_source, current PR source is $EXPECTED_SOURCE_SHA."
            echo "::error::Build the configured simulator on this exact commit, then dispatch with its run ID and SHA-256."
            exit 1
          fi
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --pattern 'pasofi-ios-configured-simulator-*' --dir "$check/download"
          archive=$(find "$check/download" -name PasoFi-configured-simulator.tar.gz -type f)
          test -f "$archive"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$check/package"
      - name: Compile the independent UI test host
        timeout-minutes: 9
        run: |
          check="$RUNNER_TEMP/pasofi-installed-client"
          if ! ruby -rxcodeproj -e 'exit' >/dev/null 2>&1; then
            gem install xcodeproj --version 1.27.0 --install-dir "$check/gems" --no-document
            export GEM_PATH="$check/gems:$(ruby -e 'puts Gem.path.join(":")')"
          fi
          ruby scripts/installed-ios-account.rb "$check/test-host" "$PWD/ios/Tests/ConfiguredAccessTests.swift"
          xcodebuild build-for-testing -project "$check/test-host/InstalledClient.xcodeproj" -scheme InstalledClient \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- -derivedDataPath "$check/test-build"
      - name: Boot iPhone simulator and install the exact packaged application
        timeout-minutes: 12
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime, devices in sorted(json.load(sys.stdin)["devices"].items(), reverse=True) if ".iOS-" in runtime for d in devices if d["name"].startswith("iPhone") and d["isAvailable"]))')
          xcrun simctl boot "$device" || xcrun simctl list devices booted | grep -F "$device"
          xcrun simctl bootstatus "$device" -b
          echo "PASOFI_SIMULATOR=$device" >> "$GITHUB_ENV"
          xcrun simctl install "$device" "$RUNNER_TEMP/pasofi-installed-client/package/App.app"
          xcrun simctl launch "$device" com.onesa.pasofi
      - name: Observe the live account gate from My PasoFi
        timeout-minutes: 11
        run: |
          check="$RUNNER_TEMP/pasofi-installed-client"
          runs=("$check"/test-build/Build/Products/*.xctestrun)
          test "${#runs[@]}" -eq 1
          xcodebuild test-without-building -xctestrun "${runs[0]}" -destination "platform=iOS Simulator,id=$PASOFI_SIMULATOR" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 240 \
            -resultBundlePath "$check/InstalledClient.xcresult"
