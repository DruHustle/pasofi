name: Inspect the published PasoFi Android preview upgrade
on:
  push:
    branches: [qualify/published-android-upgrade-20261112]
permissions:
  contents: read
  actions: read
jobs:
  installer:
    name: Install the two published preview APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Fetch the original release artifacts and verify archive and APK bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pasofi-upgrade-qa"
          mkdir -p "$root/evidence"
          cd "$root"
          gh api repos/DruHustle/pasofi/actions/artifacts/13946805604/zip > previous.zip
          gh api repos/DruHustle/pasofi/actions/artifacts/13953498139/zip > current.zip
          printf '%s  %s\n' ca060cf707b8a4c4a4fc2dbadd7999c7c049eedfee27a8d737a296aa1f477b6e previous.zip 4b41ab1fe9b18bba14ab035c12355b1fd6efbb810cff3fedfa9a5ed02d432571 current.zip | sha256sum -c -
          for version in previous current; do
            unzip -p "$version.zip" pasofi-api-unconfigured-debug.apk > "$version.apk"
          done
          printf '%s  %s\n' b27ab6177d28fc13c50c92a256f61429e82194ec4e5c14db931422298bede5d0 previous.apk a113f4edfca3216aa363b8924a3d3d846134c875599aa2c418ca2377f14d73b1 current.apk | sha256sum -c -
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise clean install, actual package replacement and offline customer preview
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: python3 .github/qa/published-android-upgrade.py
      - name: Keep installer receipts and offline app screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pasofi-android-36-preview-install-and-upgrade
          path: ${{ runner.temp }}/pasofi-upgrade-qa/evidence/
          if-no-files-found: warn
          retention-days: 7
