name: Preview PasoFi UI

on:
  # The preview job is required on protected main for every pull request.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'pasofi-frontend/**'
      - '.github/workflows/ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pamofi-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_PAMOFI_API_BASE_URL: ''
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            pasofi-frontend/web/package-lock.json
            pasofi-frontend/mobile/package-lock.json
      - name: Build independent frontend previews
        run: |
          for project in web mobile; do
            npm --prefix "pasofi-frontend/$project" ci --no-audit --no-fund
            npm --prefix "pasofi-frontend/$project" run build
          done
      - name: Validate built preview entry points
        run: |
          test -s pasofi-frontend/web/dist/index.html
          test -s pasofi-frontend/mobile/dist/index.html
      - name: Package review materials
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ui-review
          cp -R pasofi-frontend/web/dist ui-review/web
          cp -R pasofi-frontend/mobile/dist ui-review/mobile
          git rev-parse HEAD > ui-review/SOURCE_COMMIT.txt
          printf '%s\n' 'Internal UI review only. No live payment, customer account or physical hotspot qualification is implied.' > ui-review/README.txt
      - name: Upload private UI review artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pasofi-ui-review-${{ github.sha }}
          path: ui-review/
          if-no-files-found: error
          retention-days: 3
