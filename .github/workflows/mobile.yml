name: Build PasoFi native previews

on:
  # Both native jobs are required on protected main, including for web-only
  # changes. A path-filtered workflow leaves these checks pending forever.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'pasofi-frontend/mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pamofi-native-${{ github.ref }}
  cancel-in-progress: true

# These artifacts deliberately have no API endpoint or signing secrets.
# Native policy tests and compilation do not qualify device cookie persistence,
# merchant provisioning or actual wallet transactions.
env:
  VITE_PAMOFI_API_BASE_URL: ''

defaults:
  run:
    shell: bash
    working-directory: pasofi-frontend/mobile

jobs:
  android:
    name: Android debug APK (API unconfigured)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: pasofi-frontend/mobile/package-lock.json
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked web and Capacitor dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and sync fresh Android assets
        run: |
          npm run build
          npx --no-install cap sync android
      - name: Install required Android SDK
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          test "$license_status" -eq 0
          "$sdkmanager_path" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Compile Android debug APK with the checked-in Gradle wrapper
        working-directory: pasofi-frontend/mobile/android
        run: |
          test "$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties)" = 'https\://services.gradle.org/distributions/gradle-8.14.3-all.zip'
          printf '%s\n' '7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          bash ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify Android output and report its checksum
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          sha256sum "$apk" >> "$GITHUB_STEP_SUMMARY"
      - name: Package review artifact and provenance
        run: |
          mkdir -p native-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk native-artifacts/pasofi-api-unconfigured-debug.apk
          cp -R android/app/build/test-results/testDebugUnitTest native-artifacts/android-unit-test-results
          cp NATIVE_BUILDS.md native-artifacts/READ-ME.md
          git rev-parse HEAD > native-artifacts/SOURCE_COMMIT.txt
          java -version 2> native-artifacts/JAVA_VERSION.txt
          cd native-artifacts
          sha256sum pasofi-api-unconfigured-debug.apk > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload Android preview
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pasofi-android-api-unconfigured-debug-${{ github.sha }}
          path: pasofi-frontend/mobile/native-artifacts/
          if-no-files-found: error
          retention-days: 3

  ios:
    name: iOS unsigned Release simulator app (API unconfigured)
    # Standard Intel host avoids the ARM runner capacity queue; the Xcode 26+
    # gate and generic simulator build (all supported architectures) stay intact.
    runs-on: macos-26-intel
    timeout-minutes: 55
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: pasofi-frontend/mobile/package-lock.json
      - name: Verify Xcode 26 or newer
        run: |
          xcodebuild -version
          xcode_major=$(xcodebuild -version | awk '/^Xcode / {split($2, version, "."); print version[1]}')
          test "$xcode_major" -ge 26
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Verify native customer request and session policy
        run: |
          mkdir -p native-build
          xcrun swiftc -parse-as-library \
            ios/App/App/CustomerApiPolicy.swift \
            ios/Tests/CustomerApiPolicyTests.swift \
            -o "$RUNNER_TEMP/pasofi-customer-policy-tests"
          "$RUNNER_TEMP/pasofi-customer-policy-tests" | tee native-build/customer-policy-results.txt
      - name: Install locked web and Capacitor dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and sync fresh iOS assets
        run: |
          npm run build
          npx --no-install cap sync ios
      - name: Resolve pinned Swift packages in an isolated directory
        # A cold Stripe SDK checkout can take more than ten minutes on the Intel runner.
        timeout-minutes: 20
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          # Fetch the locked Stripe release without cloning its full binary history.
          stripe_url=https://github.com/stripe/stripe-ios.git
          stripe_tag=26.15.1
          stripe_commit=2f4547639a5aed18d39e4ba44c0ba684dab3161b
          stripe_mirror=$(mktemp -d "$RUNNER_TEMP/pasofi-stripe-XXXXXX")
          git init --bare --quiet "$stripe_mirror"
          git -C "$stripe_mirror" fetch --quiet --depth=1 --no-tags "$stripe_url" "refs/tags/$stripe_tag:refs/tags/$stripe_tag"
          test "$(git -C "$stripe_mirror" rev-parse "refs/tags/$stripe_tag^{commit}")" = "$stripe_commit"
          git -C "$stripe_mirror" update-ref refs/heads/pinned "$stripe_commit"
          git -C "$stripe_mirror" symbolic-ref HEAD refs/heads/pinned
          # The system Git transport uses this mirror only for the exact upstream URL.
          # Package.resolved retains its published URL, version and commit.
          # Bypass the missing shared cache checkout observed during package fetch.
          # Retry dependency resolution once on its I/O exit code, never compilation.
          for attempt in 1 2; do
            swiftpm_directory=$(mktemp -d "$RUNNER_TEMP/pasofi-swiftpm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")
            mkdir -p "$swiftpm_directory/SourcePackages" "$swiftpm_directory/Cache"
            if GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="url.file://$stripe_mirror.insteadOf" GIT_CONFIG_VALUE_0="$stripe_url" \
              xcodebuild -resolvePackageDependencies \
              -project ios/App/App.xcodeproj -scheme App \
              -clonedSourcePackagesDirPath "$swiftpm_directory/SourcePackages" \
              -packageCachePath "$swiftpm_directory/Cache" \
              -disablePackageRepositoryCache -scmProvider system; then
              printf 'PASOFI_SWIFTPM_DIRECTORY=%s\n' "$swiftpm_directory" >> "$GITHUB_ENV"
              break
            else
              resolve_status=$?
              if [ "$resolve_status" -ne 74 ] || [ "$attempt" -eq 2 ]; then
                exit "$resolve_status"
              fi
              printf '%s\n' '::warning::Swift package resolution exited 74; retrying once in another fresh directory.'
            fi
          done
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const resolved = JSON.parse(fs.readFileSync('ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'utf8'));
          const expected = [
            ['capacitor-swift-pm', 'https://github.com/ionic-team/capacitor-swift-pm.git', '8.6.0', 'e9e932f7748d3b948bc47f5791c761ac5221ec6a'],
            ['ion-ios-filesystem', 'https://github.com/ionic-team/ion-ios-filesystem.git', '2.0.1', '549c18ad9d9bb70d05df37cc3f6f7aa7f5d0ee52'],
            ['stripe-ios', 'https://github.com/stripe/stripe-ios.git', '26.15.1', '2f4547639a5aed18d39e4ba44c0ba684dab3161b'],
          ];
          if (!Array.isArray(resolved.pins) || resolved.pins.length !== expected.length) throw Error('Unexpected Swift package dependencies');
          for (const [identity, location, version, revision] of expected) {
            const pin = resolved.pins.find(value => value.identity === identity);
            if (pin?.kind !== 'remoteSourceControl' || pin.location !== location || pin.state?.version !== version || pin.state.revision !== revision) throw Error(`Unexpected ${identity} package resolution`);
          }
          JS
          mkdir -p native-build
          cp ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved native-build/ios-package-resolved.json
      - name: Compile unsigned Release simulator app
        run: |
          # Stripe's source package prints analytics payloads under DEBUG.
          # Compile the tested simulator build in Release, with API still unconfigured.
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath native-build/ios \
            -clonedSourcePackagesDirPath "$PASOFI_SWIFTPM_DIRECTORY/SourcePackages" \
            -packageCachePath "$PASOFI_SWIFTPM_DIRECTORY/Cache" \
            -disablePackageRepositoryCache -disableAutomaticPackageResolution \
            -scmProvider system \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= ONLY_ACTIVE_ARCH=NO build
          cmp native-build/ios-package-resolved.json ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Verify simulator executable and report its checksum
        run: |
          executable=native-build/ios/Build/Products/Release-iphonesimulator/App.app/App
          test -x "$executable"
          shasum -a 256 "$executable" >> "$GITHUB_STEP_SUMMARY"
      - name: Select physical-device archive qualification
        id: device_archive
        run: |
          paths=$(git -C ../.. diff --name-only HEAD^1 HEAD -- .github/workflows/mobile.yml pasofi-frontend/mobile/ios pasofi-frontend/mobile/src pasofi-frontend/mobile/package-lock.json)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -n "$paths" ]]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Archive unsigned iPhoneOS Release with production web assets
        if: steps.device_archive.outputs.required == 'true'
        env:
          VITE_PAMOFI_API_BASE_URL: https://pasofi.mobile.onesa.eu
        run: |
          npm run build
          npx --no-install cap copy ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Pasofi.xcarchive" -derivedDataPath "$RUNNER_TEMP/pasofi-device-build" \
            -clonedSourcePackagesDirPath "$PASOFI_SWIFTPM_DIRECTORY/SourcePackages" \
            -packageCachePath "$PASOFI_SWIFTPM_DIRECTORY/Cache" -disablePackageRepositoryCache \
            -disableAutomaticPackageResolution -scmProvider system ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= archive
          cmp native-build/ios-package-resolved.json ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Verify physical iOS archive identity and architecture
        if: steps.device_archive.outputs.required == 'true'
        run: |
          archive="$RUNNER_TEMP/Pasofi.xcarchive"
          app="$archive/Products/Applications/App.app"
          info="$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = 'com.onesa.pasofi'
          test "$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$info")" = iphoneos
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$info")" = iPhoneOS
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info")
          test -x "$app/$executable"
          xcrun lipo "$app/$executable" -verify_arch arm64
          xcrun vtool -arch arm64 -show-build "$app/$executable" | grep -Eq 'platform[[:space:]]+IOS$'
          test ! -e "$app/embedded.mobileprovision"
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:ApplicationPath' "$archive/Info.plist"
          xcrun lipo -archs "$app/$executable" >> "$GITHUB_STEP_SUMMARY"
          shasum -a 256 "$app/$executable" >> "$GITHUB_STEP_SUMMARY"
          echo 'com.onesa.pasofi, generic physical iOS, Release, no distribution signature' >> "$GITHUB_STEP_SUMMARY"
      - name: Package simulator app without losing executable permissions
        run: |
          mkdir -p native-artifacts
          tar -czf native-artifacts/pasofi-api-unconfigured-ios-simulator.tar.gz \
            -C native-build/ios/Build/Products/Release-iphonesimulator App.app
          cp NATIVE_BUILDS.md native-artifacts/READ-ME.md
          cp native-build/ios-package-resolved.json native-artifacts/Package.resolved
          cp native-build/customer-policy-results.txt native-artifacts/ios-customer-policy-results.txt
          git rev-parse HEAD > native-artifacts/SOURCE_COMMIT.txt
          xcodebuild -version > native-artifacts/XCODE_VERSION.txt
          printf '%s\n' 'Release; API unconfigured; unsigned simulator' > native-artifacts/BUILD_CONFIGURATION.txt
          cd native-artifacts
          shasum -a 256 pasofi-api-unconfigured-ios-simulator.tar.gz > SHA256SUMS.txt
          shasum -a 256 --check SHA256SUMS.txt
      - name: Upload iOS simulator preview
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pasofi-ios-api-unconfigured-simulator-${{ github.sha }}
          path: pasofi-frontend/mobile/native-artifacts/
          if-no-files-found: error
          retention-days: 3
