server {
  listen 80;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  location = /api/bundles { set $prepaid prepaid-access; proxy_pass http://$prepaid:3000/v1/bundles; }
  location = /api/help { set $help assistant; proxy_pass http://$help:3000/v1/help; }
  location / { try_files $uri $uri/ /index.html; }
}
