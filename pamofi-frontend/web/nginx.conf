server {
  listen 80;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  location = /api/bundles { set $prepaid prepaid-access; proxy_pass http://$prepaid:3000/v1/bundles$is_args$args; }
  location = /api/help { set $help assistant; proxy_pass http://$help:3000/v1/help$is_args$args; }
  location = /api/access { set $prepaid prepaid-access; proxy_pass http://$prepaid:3000/v1/access$is_args$args; }
  location = /api/orders { set $prepaid prepaid-access; proxy_pass http://$prepaid:3000/v1/orders$is_args$args; }
  location ~ ^/api/orders/([0-9a-fA-F-]+)/demo-confirm$ { set $prepaid prepaid-access; proxy_pass http://$prepaid:3000/v1/orders/$1/demo-confirm; }
  location = /api/session { set $identity identity; proxy_pass http://$identity:3000/v1/session; }
  location = /api/recovery { set $identity identity; proxy_pass http://$identity:3000/v1/recovery; }
  location = /api/recovery/status { set $identity identity; proxy_pass http://$identity:3000/v1/recovery/status; }
  location = /api/recovery/setup { set $identity identity; proxy_pass http://$identity:3000/v1/recovery/setup; }
  location = /api/recovery/rotate { set $identity identity; proxy_pass http://$identity:3000/v1/recovery/rotate; }
  # Internal service authority is never reachable through this public proxy.
  location /api/ { default_type application/json; return 404 '{"error":"not_found"}'; }
  location / { try_files $uri $uri/ /index.html; }
}
