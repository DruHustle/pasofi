server {
  listen 80;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  # Optional router form submission requires exact qualified origins here AND in
  # VITE_PAMOFI_ROUTER_FORM_ORIGINS. Default uses manual sign-in without URL secrets.
  add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  location ~ ^/api/(bundles|capabilities|sites|access|usage)$ { set $prepaid prepaid-access; proxy_pass http://$prepaid:3000/v1/$1$is_args$args; }
  location = /api/help { set $help assistant; proxy_pass http://$help:3000/v1/help$is_args$args; }
  location ~ ^/api/(orders(?:/[0-9a-fA-F-]+/(?:demo-confirm|checkout|status|mock-payment|expire-unused))?)$ { set $prepaid prepaid-access; proxy_pass http://$prepaid:3000/v1/$1$is_args$args; }
  location = /api/session { set $identity identity; proxy_pass http://$identity:3000/v1/session; }
  location ~ ^/api/(recovery(?:/(?:status|setup|rotate))?|handoff(?:/redeem)?)$ { set $identity identity; proxy_pass http://$identity:3000/v1/$1; }
  location ~ ^/api/(staff/(?:register|login|session|mfa/(?:setup|confirm|verify)|users(?:/[0-9a-fA-F-]+/(?:decision|revoke-sessions|recover-mfa))?|audit))$ { set $identity identity; proxy_pass http://$identity:3000/v1/$1$is_args$args; }
  location ~ ^/api/(staff/(?:sites|inventory|sales(?:/[0-9a-fA-F-]+/(?:receipt|delivery|resend))?))$ { set $prepaid prepaid-access; proxy_pass http://$prepaid:3000/v1/$1$is_args$args; }
  location ~ "^/api/(admin/(?:sites|inventory/allocations|network/reviews(?:/[0-9a-fA-F-]+/resolve)?|bundles(?:/[a-z][a-z0-9-]{0,39})?))$" { set $prepaid prepaid-access; proxy_pass http://$prepaid:3000/v1/$1$is_args$args; }
  location ~ ^/api/(receipt-pairings(?:/[0-9a-fA-F-]+)?|vouchers/redeem|payments/methods|network/(?:sites|session|credentials|disconnect))$ { set $prepaid prepaid-access; proxy_pass http://$prepaid:3000/v1/$1$is_args$args; }
  location /api/ { default_type application/json; return 404 '{"error":"not_found"}'; }
  location / { try_files $uri $uri/ /index.html; }
}
