server {
  listen 80;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  # Optional router form submission requires exact qualified origins here AND in
  # VITE_PAMOFI_ROUTER_FORM_ORIGINS. Only the registered PasoFi HTTPS origins are allowed.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self' https://hotspot.pasofi.onesa.eu https://hotspot.pamofi.onesa.eu" always;
  location ~ ^/api/(bundles|capabilities|sites|access|usage)$ { set $prepaid prepaid-access; proxy_pass http://$prepaid:3000/v1/$1$is_args$args; }
  location = /api/help { set $help assistant; proxy_pass http://$help:3000/v1/help$is_args$args; }
  location ~ ^/api/(orders(?:/[0-9a-fA-F-]+/(?:demo-confirm|checkout|status|mock-payment|expire-unused))?)$ { set $prepaid prepaid-access; proxy_pass http://$prepaid:3000/v1/$1$is_args$args; }
  location ~ ^/api/((?:customer|staff)/invoices(?:/[0-9a-fA-F-]+(?:/pdf)?)?|invoice-downloads)$ { set $prepaid prepaid-access; proxy_pass http://$prepaid:3000/v1/$1$is_args$args; }
  location = /api/session { set $identity identity; proxy_pass http://$identity:3000/v1/session; }
  location ~ ^/api/(recovery(?:/(?:status|setup|rotate))?|handoff(?:/redeem)?)$ { set $identity identity; proxy_pass http://$identity:3000/v1/$1; }
  location ~ ^/api/(staff/(?:register|login|session|mfa/(?:setup|confirm|verify)|password-reset/(?:availability|request|confirm)|users(?:/[0-9a-fA-F-]+/(?:decision|revoke-sessions|recover-mfa))?|audit))$ { set $identity identity; proxy_pass http://$identity:3000/v1/$1$is_args$args; }
  location ~ ^/api/(staff/(?:sites|inventory|cash-refunds(?:/[0-9a-fA-F-]+/(?:prepare-payout|payout))?|cash-shifts(?:/[0-9a-fA-F-]+/close)?|cash-references/lookup|sales(?:/[0-9a-fA-F-]+/(?:receipt|delivery|resend))?))$ { set $prepaid prepaid-access; proxy_pass http://$prepaid:3000/v1/$1$is_args$args; }
  location ~ "^/api/(admin/(?:sites(?:/[0-9a-fA-F-]+)?|cash-refunds/[0-9a-fA-F-]+/decision|inventory/allocations|network/reviews(?:/[0-9a-fA-F-]+/resolve)?|bundles(?:/[a-z][a-z0-9-]{0,39})?))$" { set $prepaid prepaid-access; proxy_pass http://$prepaid:3000/v1/$1$is_args$args; }
  location ~ "^/api/(admin/routers(?:/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:/changes(?:/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:/(?:apply|reconcile|rollback))?)?)?)?)$" { set $prepaid prepaid-access; proxy_read_timeout 35s; proxy_pass http://$prepaid:3000/v1/$1$is_args$args; }
  location ~ ^/api/(receipt-pairings(?:/[0-9a-fA-F-]+(?:/cancel)?)?|vouchers/redeem|payments/methods|network/(?:sites|session|credentials|disconnect))$ { set $prepaid prepaid-access; proxy_pass http://$prepaid:3000/v1/$1$is_args$args; }
  # Stripe sends the original signed JSON body directly to this exact route.
  location = /callbacks/stripe {
    limit_except POST { deny all; }
    client_max_body_size 256k;
    access_log off;
    set $prepaid prepaid-access;
    proxy_pass http://$prepaid:3000/callbacks/stripe;
    proxy_set_header Stripe-Signature $http_stripe_signature;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
  }
  location /api/ { default_type application/json; return 404 '{"error":"not_found"}'; }
  location / { try_files $uri $uri/ /index.html; }
}
