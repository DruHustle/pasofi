openapi: 3.1.0
info:
  title: PasoFi prepaid-access service
  version: 0.1.0
paths:
  /health/live:
    get:
      responses:
        '200':
          description: Process is running
  /health/ready:
    get:
      responses:
        '200':
          description: Service database is reachable
        '503':
          description: Service database unavailable
  /v1/bundles:
    get:
      summary: Read currently published catalogue versions
      responses:
        '200':
          description: Catalogue; byte limits are decimal strings
        '503':
          description: Catalogue unavailable
  /v1/orders:
    get:
      summary: List owned orders or recover one owned order by its saved request key
      description: The optional requestKey performs a read-only exact lookup within the authenticated customer's orders, including historical quotes whose bundle or checkout is no longer available. It never creates an order or starts a payment. A missing result does not prove that an earlier in-flight request cannot still complete.
      parameters:
        - in: query
          name: requestKey
          required: false
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9_-]{16,128}$'
      responses:
        '200':
          description: Resolved customerId and orders array. Without requestKey, up to 100 entries and no lookupKey property. With requestKey, at most one order and lookupKey echoes the validated exact key. Clients must match the owner, lookup key and expected bundle before restoring a saved checkout.
        '400':
          description: Invalid request key query
        '401':
          description: No valid customer session
        '503':
          description: Authoritative service unavailable
    post:
      summary: Create or retry a server-priced quote
      description: Requires the configured origin, an authenticated session, and a customer-scoped idempotency key. Demo mode is available only in demo/development. Checkout currently requires explicit local mock configuration; no external provider is selectable. Idempotency binds bundle, mode and normalized invoice delivery intent. Intent is encrypted; quotes and pending attempts issue no invoice. Only verified provider fulfillment creates a paid invoice. Demo-confirm never creates one.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundleId]
              additionalProperties: false
              properties:
                bundleId:
                  type: string
                  pattern: '^[a-z][a-z0-9-]{0,39}$'
                mode:
                  type: string
                  enum: [demo, checkout]
                  default: demo
                invoiceDelivery: {$ref: '#/components/schemas/InvoiceDeliveryIntent'}
      responses:
        '201':
          description: Quote created with immutable server terms and purchase_mode
        '200':
          description: Existing quote for the same payload
        '409':
          description: Idempotency key used for different bundle or mode
  /v1/orders/{id}/demo-confirm:
    post:
      summary: Confirm an explicitly simulated payment
      description: Demo only. Creates one queued entitlement atomically; never contacts a provider or connects a device.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Simulated confirmation
        '404':
          description: Order unavailable or simulation disabled
        '409':
          description: Quote expired or checkout order cannot use demo confirmation
  /v1/access:
    get:
      summary: List the current customer's access and purchase history
      description: Active access is returned first, followed by usable queued bundles in purchase order and then historical entries. Only the authenticated customer's records are returned. Responses include hasMore and nextOffset; use offset and limit to read subsequent pages.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        '200':
          description: Resolved customerId, up to limit entitlements, hasMore, and the next offset or null. Clients must match the owner before displaying history. Cache-Control is no-store.
        '400':
          description: Invalid pagination parameters
        '401':
          description: No valid customer session
  /v1/usage:
    get:
      security: [{CustomerSession: []}]
      summary: Read one authoritative snapshot of all owned current allowance and received usage
      description: No-store; totals are independent of access-history pagination and selected rows. Exhausted current bundles remain included. Byte values are exact decimal strings. Poll at most every five seconds while visible/online; RADIUS accounting is requested every 60 seconds and is stale after 90 seconds. A held reservation is not an extra debit and recent accounting is not instantaneous router telemetry.
      parameters:
        - in: query
          name: entitlementIds
          description: Up to 100 comma-separated UUIDs for refreshing visible cards. Foreign and nonexistent IDs are omitted identically; aggregate ownership and totals never depend on this selection.
          schema: {type: string, maxLength: 3699}
      responses:
        '200':
          description: One customer-owned database snapshot, including the current grant when present
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageSnapshot'}
        '400': {description: Invalid UUID selection or more than 100 IDs}
        '401': {description: No valid customer session; stop polling and clear private data}
        '429': {description: Customer-scoped quota exceeded; observe Retry-After}
        '503': {description: Identity or usage storage unavailable; do not replace the last verified snapshot with zero}
  /v1/capabilities:
    get:
      summary: Read explicit configured feature gates
      responses:
        '200':
          description: SMS capability also checks notification availability and simulation mode; mobileCookies remains false
          content:
            application/json:
              schema:
                type: object
                required: [demo, paymentMode, paymentCheckout, vouchers, receiptPairing, staffSales, deliverySms, networkAccess, mobileCookies]
                properties:
                  demo: {type: boolean}
                  paymentMode: {type: string, enum: [disabled, mock]}
                  paymentCheckout: {type: boolean}
                  vouchers: {type: boolean}
                  receiptPairing: {type: boolean}
                  staffSales: {type: boolean}
                  salesLocationStatus: {type: boolean, description: Supports versioned admin sales-location enable/pause decisions. This capability does not enable commerce or customer Wi-Fi. Clients must require true before showing the new action.}
                  deliverySms: {type: boolean}
                  networkAccess: {type: boolean}
                  routerFleet: {type: boolean, description: Central administration reads configured independently of customer access.}
                  routerFleetWrite: {type: boolean, description: Global fleet write gate; each router additionally requires its own write qualification.}
                  mobileCookies: {const: false}
                  invoices: {type: boolean, description: Authenticated invoice storage is configured independently of selling gates.}
                  invoiceEmail: {type: boolean, description: Outbox and secrets are configured and notification advertises a qualified matching email mode.}
                  invoiceSms: {type: boolean, description: Outbox and secrets are configured and notification advertises a qualified matching SMS mode.}
  /v1/sites:
    get:
      summary: List active commercial locations
      responses:
        '200': {description: 'sites array of UUID id and name; this does not establish router availability'}
  /v1/payments/methods:
    get:
      summary: List qualified methods for server-priced bundle and active site
      parameters:
        - {in: query, name: siteId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: bundleId, required: true, schema: {type: string}}
      responses:
        '200': {description: 'enabled, mode, simulation and methods array of code/name/currency/integer minMinor/maxMinor'}
        '404': {description: Checkout disabled or site/bundle unavailable}
  /v1/orders/{id}/checkout:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      security: [{CustomerSession: []}]
      summary: Initiate or recover one customer-owned checkout
      description: Exact origin required. Unknown/review attempts block a second charge. An untrusted redirect is never returned.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siteId, methodCode]
              properties:
                siteId: {type: string, format: uuid}
                methodCode: {type: string}
      responses:
        '200': {description: 'attemptId, state, nullable redirectUrl and simulation'}
        '409': {description: Idempotency conflict or quote/method/payment cannot be initiated}
  /v1/orders/{id}/status:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      security: [{CustomerSession: []}]
      summary: Read recorded fulfillment and provider history for a customer-owned order
      description: Available while checkout is disabled. Reads the existing ledger without contacting a provider. Attempts include their provider identity; simulation reflects recorded provenance rather than the current environment.
      responses:
        '200':
          description: Historical order status alone does not establish current fulfillment; revoked entitlementId is null
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: {type: object}
                  attempts: {type: array, items: {type: object}}
                  fulfillmentState: {type: string, enum: [unconfirmed, fulfilled, reversed, pending_review]}
                  entitlementId: {type: [string, 'null'], format: uuid}
                  entitlementRevokedAt: {type: [string, 'null'], format: date-time}
                  safeToRequote: {type: boolean, description: True only after durable server closure of an expired quote with no prior payment attempt}
                  simulation: {type: boolean}
        '404': {description: Order not owned}
  /v1/orders/{id}/expire-unused:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      security: [{CustomerSession: []}]
      summary: Fence an expired unused quote before reviewing fresh purchase terms
      description: Requires the configured browser origin. The owned order ID is the idempotency identity. Serializes with initiation and refuses every prior payment attempt, charge or entitlement; client-clock expiry is insufficient.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: Durable quote closure, including identical retries
          content:
            application/json:
              schema:
                type: object
                required: [orderId, state, safeToRequote, replayed]
                properties:
                  orderId: {type: string, format: uuid}
                  state: {type: string, const: expired_unused}
                  safeToRequote: {type: boolean, const: true}
                  replayed: {type: boolean}
        '401': {description: Customer session required}
        '403': {description: Origin rejected}
        '404': {description: Order not owned}
        '409': {description: 'quote_still_valid, payment_attempt_exists, wrong_order_mode or order_not_expirable'}
        '503': {description: Identity or payment storage unavailable; retain the existing intent}
  /v1/orders/{id}/mock-payment:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      security: [{CustomerSession: []}]
      summary: Exercise the synthetic provider reconciliation path
      description: Registered only in explicit mock demo/development mode. Makes no real charge; reversal is final.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: {type: string, enum: [success, failed, reversed]}
      responses:
        '200': {description: Reconciliation state and simulation true}
        '409': {description: Reversal is final}
  /v1/staff/sites:
    get:
      security: [{StaffSession: []}]
      summary: List sales locations in the current approved staff scope
      description: Administrators see enabled and paused sales locations. Other approved staff see their enabled assigned locations. Available independently of the global commerce switch; changing sales location status does not change NAS trust or network access.
      responses:
        '200': {description: 'sites array of id, name, enabled and version (decimal string). A status write must use this reviewed version.'}
        '403': {description: Staff not approved or MFA not completed}
  /v1/staff/inventory:
    get:
      security: [{StaffSession: []}]
      summary: Read authorized stock quantities
      responses:
        '200': {description: 'inventory array of agentId, siteId, siteName, bundleId, quantity'}
  /v1/admin/sites:
    post:
      security: [{StaffSession: []}]
      summary: Create a location as an approved MFA-verified administrator
      description: Body id or UUID Idempotency-Key fixes the site identity; different names for the same ID conflict. Router setup is independent.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                id: {type: string, format: uuid}
                name: {type: string, minLength: 1, maxLength: 100}
      responses:
        '201': {description: site created}
        '200': {description: Same site recovered}
        '409': {description: Idempotency conflict}
  /v1/admin/sites/{id}:
    patch:
      security: [{StaffSession: []}]
      summary: Enable or pause new sales at an existing sales location
      description: Requires an approved MFA-verified administrator and exact trusted Origin, even while commerce is disabled. Clients must require capabilities.salesLocationStatus=true. The row version prevents stale changes; an exact retry returns its original audited result without reapplying a later-overridden status. Refresh the site list after success or replay. Pausing serializes against new cash sales and preserves prior-sale retries, receipts, stock history and existing allowances. This does not change global commerce, NAS registration, network credentials or router configuration.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, expectedVersion, reason]
              properties:
                enabled: {type: boolean}
                expectedVersion: {type: string, pattern: '^[1-9][0-9]{0,18}$', description: Reviewed version no greater than PostgreSQL bigint maximum}
                reason: {type: string, minLength: 10, maxLength: 500, description: Trimmed audit reason of at least 10 characters}
      responses:
        '200': {description: 'site (id, name, enabled, version), changed and replayed. The append-only site.status audit event retains actor, reason, before/after and the request identity.'}
        '400': {description: Invalid UUID, idempotency key, version, boolean, reason or unknown fields}
        '401': {description: No current staff session}
        '403': {description: Origin rejected or staff not approved as an administrator}
        '404': {description: Sales location not found}
        '409': {description: Reviewed version is stale or the idempotency key belongs to different request details}
        '503': {description: Authoritative identity or database is unavailable}
  /v1/admin/bundles:
    get:
      security: [{StaffSession: []}]
      summary: List all catalogue versions including drafts as an administrator
      responses:
        '200': {description: 'products with id, price_minor, currency, byte_limit string, validity_seconds, published; configured currencies; publicationGuardVersion: 1 advertises transactional guarded withdrawals. Automated catalogue revisions must require this version before their first write.'}
    post:
      security: [{StaffSession: []}]
      summary: Create immutable catalogue terms with an audit reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, priceMinor, currency, byteLimit, validitySeconds, published, reason]
              properties:
                id: {type: string, pattern: '^[a-z][a-z0-9-]{0,39}$'}
                priceMinor: {type: integer, minimum: 1, maximum: 2147483647}
                currency: {const: USD}
                byteLimit: {type: string, pattern: '^[0-9]{1,19}$'}
                validitySeconds: {type: integer, minimum: 60, maximum: 31536000}
                published: {type: boolean}
                reason: {$ref: '#/components/schemas/Reason'}
      responses:
        '201': {description: Product version and audit created}
        '200': {description: Existing identical terms recovered}
        '409': {description: Existing version terms are immutable}
  /v1/admin/bundles/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    patch:
      security: [{StaffSession: []}]
      summary: Publish or withdraw a version with an audit reason
      description: A withdrawal may require other bundle versions to remain published. The target and all required versions are locked in deterministic ID order; prerequisite validation, withdrawal and audit commit in the same transaction. Missing or unpublished prerequisites return 409 without withdrawing the target or writing an audit entry. An omitted guard preserves the existing manual publication workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [published, reason]
              properties:
                published: {type: boolean}
                reason: {$ref: '#/components/schemas/Reason'}
                requiredPublishedBundleIds:
                  type: array
                  minItems: 1
                  maxItems: 20
                  uniqueItems: true
                  items: {type: string, pattern: '^[a-z][a-z0-9-]{0,39}$'}
                  description: Optional only when published is false. Every ID must differ from the target and identify a currently published bundle. The guard is checked under row locks in the withdrawal transaction.
      responses:
        '200': {description: Product id/publication state and durable audit}
        '400': {description: Invalid publication/reason or invalid_publication_guard}
        '404': {description: Target bundle not found}
        '409': {description: required_bundles_not_published; target and audit remain unchanged}
  /v1/admin/inventory/allocations:
    post:
      security: [{StaffSession: []}]
      summary: Allocate stock to an approved agent at an approved site
      description: An approved MFA-authenticated administrator and an available ledger are required. Stock can be prepared while customer sales are paused; inventoryAllocation reports availability independently of staffSales. A matching recorded request is replayed before rechecking target eligibility. New allocations validate the approved agent, assigned active site and published bundle under the request lock.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, siteId, bundleId, quantity, reason]
              properties:
                agentId: {type: string, format: uuid}
                siteId: {type: string, format: uuid}
                bundleId: {type: string}
                quantity: {type: integer, minimum: 1, maximum: 100000}
                reason: {$ref: '#/components/schemas/Reason'}
      responses:
        '201': {description: allocationId and replayed false; stock and audit committed atomically}
        '200': {description: Original allocationId and replayed true}
        '409': {description: allocation_agent_not_eligible or site_or_bundle_unavailable after a new request is rolled back; idempotency_conflict preserves the original recorded request}
        '409': {description: Conflict or agent/site/bundle unavailable}
  /v1/staff/sales:
    get:
      security: [{StaffSession: []}]
      summary: List authorized sales without voucher codes
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200': {description: 'sales array, hasMore and nullable nextOffset; agent owns sales, support sees assigned sites, admin sees all'}
    post:
      security: [{StaffSession: []}]
      summary: Sell one voucher from the authenticated agent's site stock
      description: Exact origin and current approved agent/MFA/site scope required. Receipt and both require pairingCode; sms and both require phone. New sales require explicit exact cash confirmation matched to the server bundle price. Cash evidence records the agent's attestation, not an independent provider settlement. Matching historical committed retries are resolved before requiring new cash evidence and remain unrecorded. Prices and commission come from server configuration and are immutable snapshots.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siteId, bundleId, delivery]
              properties:
                siteId: {type: string, format: uuid}
                bundleId: {type: string}
                delivery: {type: string, enum: [receipt, sms, both]}
                pairingCode: {type: string, minLength: 10, maxLength: 32}
                phone: {type: string, description: Zimbabwe mobile number normalized to 263 and nine digits}
                payment: {$ref: '#/components/schemas/CashConfirmation'}
                invoiceDelivery: {$ref: '#/components/schemas/InvoiceDeliveryIntent'}
      responses:
        '201': {description: sale snapshot including immutable payment evidence, invoice id/number/downloadPath, and replayed false; no plaintext voucher. Invoice and any requested email/SMS invoice.issued outbox event commit with the recorded cash sale. Download-only invoices create no notification job.}
        '200': {description: Original sale snapshot and replayed true; historical tender remains unrecorded}
        '409': {description: 'cash_confirmation_required, cash_amount_mismatch, stock/pairing/delivery unavailable or idempotency conflict'}
  /v1/staff/sales/{id}/receipt:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      security: [{StaffSession: []}]
      summary: Read the private voucher receipt as the owning agent or an administrator
      responses:
        '200': {description: 'receipt {sale,voucher:{id,code,state}} and simulation; no-store'}
        '403': {description: Support or another unauthorized role cannot reveal vouchers}
        '404': {description: Sale outside current ownership/site scope}
  /v1/staff/sales/{id}/delivery:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      security: [{StaffSession: []}]
      summary: Read sanitized delivery status in staff sale scope
      responses:
        '200': {description: 'state, simulation, attempts and optional latest job metadata; no phone, voucher or provider credentials'}
  /v1/staff/sales/{id}/resend:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      security: [{StaffSession: []}]
      summary: Explicitly resend the saved voucher to its saved recipient
      description: Owning agent or administrator only. Unknown or otherwise unresolved delivery blocks resend; no new voucher or entitlement is created.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {$ref: '#/components/schemas/Reason'}
      responses:
        '201': {description: New jobId and replayed false}
        '200': {description: Original jobId and replayed true}
        '409': {description: Idempotency conflict or unresolved delivery}
  /v1/receipt-pairings:
    post:
      security: [{CustomerSession: []}]
      summary: Create a private five-minute receipt pairing code
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '201': {description: 'pairing {id,code,expiresAt} and replayed false; code is ten random characters'}
        '200': {description: Original pairing and replayed true}
        '409': {description: Original unused pairing expired}
  /v1/receipt-pairings/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      security: [{CustomerSession: []}]
      summary: Poll the owning customer's private receipt
      responses:
        '200': {description: 'status pending/expired/ready; ready includes receipt {sale,voucher:{id,code,state}}'}
        '404': {description: Unknown pairing or different customer}
  /v1/vouchers/redeem:
    post:
      security: [{CustomerSession: []}]
      summary: Redeem one voucher into the current customer account
      description: Exact origin required; 10 requests per minute. Paired vouchers belong only to the paired customer. Redemption does not activate validity or connect a device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, maxLength: 64}
      responses:
        '200': {description: entitlementId and replayed; an owner retry returns the original entitlement}
        '409': {description: invalid_or_used including ownership mismatch}
        '429': {description: Request rate exceeded}
  /internal/v1/deliveries/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      security: [{InternalBearer: []}]
      summary: Resolve a delivery reference for the notification service
      description: Private route. Requires notification issuer/subject, prepaid-access audience and delivery:read scope using INTERNAL_DELIVERY_SECRET. Never expose through a public gateway.
      responses:
        '200': {description: 'deliveryReference, saleId, simulation and channel none or sms; sms includes transient to/from/message with the same voucher'}
        '410': {description: Voucher start-by deadline passed}
  /v1/network/sites:
    get:
      security: [{CustomerSession: []}]
      summary: List qualified network sites with configured safe login URLs
      responses:
        '200': {description: sites with id/name/loginUrl}
        '404': {description: Network feature disabled}
  /v1/network/session:
    get:
      security: [{CustomerSession: []}]
      summary: Read this customer's current reservation and observed connection state
      responses:
        '200': {description: 'nullable session with id, siteId, state, accountedAt, deadline, chargedBytes, disconnectRequested and connected'}
  /v1/network/credentials:
    post:
      security: [{CustomerSession: []}]
      summary: Request a short-lived site credential for eligible access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [siteId, requestKey]
              properties:
                siteId: {type: string, format: uuid}
                requestKey: {type: string, format: uuid}
      responses:
        '200': {description: username/password/expiresAt/loginUrl; no-store, no logging, no URL transport}
        '409': {description: Existing reservation, accounting hold or no usable entitlement}
  /v1/network/disconnect:
    post:
      security: [{CustomerSession: []}]
      summary: Request termination while retaining the reservation until verified closure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grantId]
              properties:
                grantId: {type: string, format: uuid}
      responses:
        '202': {description: state disconnect_pending}
        '200': {description: state closed}
        '404': {description: Grant not owned by this customer}
  /v1/admin/network/reviews:
    get:
      security: [{StaffSession: []}]
      summary: List uncertain or held reservations for MFA-verified administrators
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200': {description: 'reviews with grant/customer/site/NAS IDs, version string, cumulative counter maxima including late evidence, charged/reserved byte strings, absence/fencing dates, anomaly and reason; hasMore/nextOffset'}
  /v1/admin/network/reviews/{id}/resolve:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      security: [{StaffSession: []}]
      summary: Settle bounded verified final usage with an immutable operator audit
      description: Requires current MFA administrator, exact origin, expected review version, fresh independent absence/fencing, no other live grant and final counters that include all evidence without exceeding the reservation. Never estimates unknown usage.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, finalUpload, finalDownload, reason, evidenceReference]
              properties:
                expectedVersion: {type: string, pattern: '^[1-9][0-9]*$'}
                finalUpload: {$ref: '#/components/schemas/Counter'}
                finalDownload: {$ref: '#/components/schemas/Counter'}
                reason: {$ref: '#/components/schemas/Reason'}
                evidenceReference: {$ref: '#/components/schemas/Reason'}
      responses:
        '200': {description: 'state closed, grantId, chargedBytes, additionalBytes, version and replayed; only this hold is cleared'}
        '409': {description: Stale review, idempotency conflict, insufficient evidence, another unresolved session or unbounded final usage}
  /v1/customer/invoices:
    get:
      security: [{CustomerSession: []}]
      summary: List owned paid invoices even while purchases are paused
      description: Cash ownership follows the paired or redeeming customer; digital invoices belong to the order customer. No contact destinations or download tokens are returned. Supports limit (default 25, max 100), offset, and optional UUID saleId/orderId filters.
      responses:
        '200': {description: 'invoices array of InvoiceSummary, hasMore and nullable nextOffset'}
        '401': {description: Customer session required}
  /v1/customer/invoices/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      security: [{CustomerSession: []}]
      summary: Read the immutable owned invoice and safe delivery status
      responses:
        '200': {description: 'invoice contains InvoiceSummary, immutable snapshot, canonical /v1 downloadPath and delivery state; requestedChannel does not claim that a message was sent'}
        '404': {description: Invoice not found or not owned}
  /v1/customer/invoices/{id}/pdf:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      security: [{CustomerSession: []}]
      summary: Download the original stored invoice PDF
      responses:
        '200': {description: Byte-identical PDF attachment with Cache-Control no-store, content: {application/pdf: {schema: {type: string, format: binary}}}}
        '404': {description: Invoice not found or not owned}
  /v1/staff/invoices:
    get:
      security: [{StaffSession: []}]
      summary: List invoices within current administrator or issuing-agent authority
      description: Administrator sees cash and digital invoices. An agent sees only their own cash sales at currently assigned sites. Support is not authorized. Same pagination and optional saleId/orderId filters as the customer list; selling gates do not disable records access.
      responses:
        '200': {description: 'invoices array of InvoiceSummary, hasMore and nullable nextOffset'}
        '403': {description: Current administrator or agent authority required}
  /v1/staff/invoices/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      security: [{StaffSession: []}]
      summary: Read an authorized immutable invoice and safe delivery status
      responses:
        '200': {description: 'invoice contains InvoiceSummary, snapshot, downloadPath and delivery state'}
        '404': {description: Invoice outside current ownership or site scope}
  /v1/staff/invoices/{id}/pdf:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      security: [{StaffSession: []}]
      summary: Download an authorized original invoice PDF
      responses:
        '200': {description: PDF attachment with no-store, content: {application/pdf: {schema: {type: string, format: binary}}}}
        '404': {description: Invoice outside current ownership or site scope}
  /internal/v1/invoices/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      security: [{InternalBearer: []}]
      summary: Resolve one invoice delivery without exposing its recipient publicly
      description: Requires INTERNAL_DELIVERY_SECRET JWT with notification issuer/subject, prepaid-access audience and invoice:read scope. Returns invoiceId, invoiceNumber, channel (email, sms or none), simulation, filename and contentType; email adds to, SMS adds to, an expiring fragment link and expiresAt (ISO UTC). Event invoice.issued version 1 contains only invoiceId and uses that ID as aggregateId. Delivery is asynchronous and never part of the payment transaction.
      responses:
        '200': {description: Bounded private delivery metadata, no voucher or network credentials}
        '410': {description: SMS invoice link expired}
  /internal/v1/invoices/{id}/pdf:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      security: [{InternalBearer: []}]
      summary: Read original PDF bytes for a transactional email attachment
      description: Same invoice:read service authority as private invoice metadata; unavailable to the public gateway.
      responses:
        '200': {description: Original PDF with no-store, content: {application/pdf: {schema: {type: string, format: binary}}}}
  /v1/invoice-downloads:
    post:
      security: []
      summary: Redeem an expiring invoice-only SMS link for the PDF
      description: The 32-byte random bearer token is carried in a URL fragment, then submitted in this body; only its hash is looked up. Requires an allowed Origin, is rate limited to 10 per minute, expires seven days after issuance and grants no account, voucher or network access. No anonymous lookup by invoice ID is exposed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
      responses:
        '200': {description: Invoice-only PDF attachment with no-store, content: {application/pdf: {schema: {type: string, format: binary}}}}
        '403': {description: Origin rejected}
        '404': {description: Invalid or expired link}
        '429': {description: Retry-After applies}
  /v1/admin/routers:
    get:
      security: [{StaffSession: []}]
      summary: List the registered router fleet for an approved MFA-verified administrator
      description: Independent of customer commerce and network launch gates. Credentials, management URLs and private service tokens are never returned. No query parameters are accepted.
      responses:
        '200': {description: routers array with NAS/site identity, configuration and per-device write readiness}
        '401': {description: Staff session required}
        '403': {description: Administrator role required}
        '404': {description: Fleet reads disabled}
        '503': {description: Identity or network service unavailable}
  /v1/admin/routers/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      security: [{StaffSession: []}]
      summary: Inspect the selected router and its explicitly managed targets
      responses:
        '200': {description: Router, verified device identity, targets with values/field metadata/revisions, and observation timestamp}
        '409': {description: Unconfigured or mismatched device or unavailable target}
        '503': {description: Device or private service unavailable}
  /v1/admin/routers/{id}/changes:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      security: [{StaffSession: []}]
      summary: Read the latest 50 durable configuration changes
      responses:
        '200': {description: changes array, newest first; actorVersion is an exact decimal string}
    post:
      security: [{StaffSession: []}]
      summary: Save one reviewed configuration preview without writing to the router
      description: Requires the configured browser origin and global/per-device write gates. The server derives the administrator identity and version. A UUID Idempotency-Key binds the operation. Preview expires after ten minutes.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetKey, expectedRevision, values, reason]
              properties:
                targetKey: {type: string, pattern: '^[a-z][a-z0-9_-]{0,47}$'}
                expectedRevision: {type: string, pattern: '^[0-9a-f]{64}$'}
                values:
                  type: object
                  minProperties: 1
                  maxProperties: 8
                  description: Only fields advertised for the enrolled target; strings or booleans. No URLs, menu paths or credentials.
                  additionalProperties:
                    oneOf:
                      - {type: string, maxLength: 160}
                      - {type: boolean}
                reason: {$ref: '#/components/schemas/Reason'}
      responses:
        '200': {description: Saved change with before/after values and revisions}
        '400': {description: Invalid field, value, reason or idempotency key}
        '403': {description: Per-device write qualification denied}
        '409': {description: Revision conflict, router busy, idempotency conflict or writes disabled}
  /v1/admin/routers/{id}/changes/{changeId}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: changeId, required: true, schema: {type: string, format: uuid}}
    get:
      security: [{StaffSession: []}]
      summary: Read the durable outcome after a response timeout or interruption
      responses:
        '200': {description: 'change; status is prepared, applying, applied, unchanged, diverged, uncertain, expired or failed; reconcileAfter is the earliest safe reconciliation time'}
  /v1/admin/routers/{id}/changes/{changeId}/apply:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: changeId, required: true, schema: {type: string, format: uuid}}
    post:
      security: [{StaffSession: []}]
      summary: Apply the saved preview once as its original administrator and authorization version
      description: Requires configured browser origin and empty JSON object. Revalidates serial, policy, expiry and revision; records applying before hardware mutation. A transport failure must be resolved through status/reconcile, never a new blind write.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200': {description: Durable change state; repeated apply returns state without another device write}
        '403': {description: Actor mismatch or device writes disabled}
        '409': {description: Another change holds the router or global writes disabled}
        '503': {description: Outcome unavailable; retrieve the saved change ID}
  /v1/admin/routers/{id}/changes/{changeId}/reconcile:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: changeId, required: true, schema: {type: string, format: uuid}}
    post:
      security: [{StaffSession: []}]
      summary: Observe an ambiguous change after its settlement period without writing to the device
      description: Requires configured browser origin and empty JSON object. Remains available with writes disabled; any current approved administrator may reconcile.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200': {description: Updated observed change state}
        '409': {description: Reconciliation is too early; retain the existing outcome and reconcileAfter}
  /v1/admin/routers/{id}/changes/{changeId}/rollback:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: changeId, required: true, schema: {type: string, format: uuid}}
    post:
      security: [{StaffSession: []}]
      summary: Prepare a new inverse preview while the current router still matches an applied change
      description: This operation does not apply the rollback. Review and apply the newly returned change ID through the ordinary flow.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {$ref: '#/components/schemas/Reason'}
      responses:
        '200': {description: New inverse change preview, linked to the original change}
        '409': {description: Parent not applied, current values changed, router busy or idempotency conflict}
components:
  securitySchemes:
    CustomerSession:
      type: apiKey
      in: cookie
      name: __Host-pamofi_session
      description: Same-origin opaque customer session resolved by identity; demo uses pamofi_demo_session.
    StaffSession:
      type: apiKey
      in: cookie
      name: __Host-pamofi_staff_session
      description: Current approved MFA-completed staff session; demo uses pamofi_demo_staff_session. Authority is resolved on every request.
    InternalBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Scoped service-to-service JWT with issuer/subject/audience/iat/exp validation; never a browser authorization token.
  parameters:
    Id: {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {in: header, name: Idempotency-Key, required: true, schema: {type: string, format: uuid}}
    Limit: {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    Offset: {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
  schemas:
    InvoiceDeliveryIntent:
      type: object
      additionalProperties: false
      required: [channel]
      description: Optional transactional receipt destination. Omission means download. Email/SMS require a valid recipient; download must omit it. Stored encrypted and bound to the original request; never grants marketing permission. Disabled providers do not disable authenticated PDF access.
      properties:
        channel: {type: string, enum: [download, email, sms]}
        recipient: {type: string, maxLength: 254, description: Email address or Zimbabwe mobile number; SMS normalizes to 263 and nine digits.}
    InvoiceSummary:
      type: object
      description: An immutable commercial payment record, explicitly not a ZIMRA fiscal tax invoice. Original PDF and terms survive later refunds/reversals unchanged; no tax number, VAT rate, fiscal QR or deductibility is invented.
      properties:
        id: {type: string, format: uuid}
        number: {type: string, pattern: '^PFI-[0-9]+$'}
        issuedAt: {type: string, format: date-time}
        paidAt: {type: string, format: date-time}
        currency: {type: string}
        totalMinor: {type: integer, minimum: 1}
        sourceType: {type: string, enum: [cash, digital]}
        saleId: {type: [string, 'null'], format: uuid}
        orderId: {type: [string, 'null'], format: uuid}
        simulation: {type: boolean}
        requestedChannel: {type: string, enum: [download, email, sms]}
    UsageBytes: {type: string, pattern: '^(0|[1-9][0-9]*)$', description: Exact nonnegative decimal byte count; aggregate can exceed the signed 64-bit range.}
    UsageTotals:
      type: object
      required: [bundleCount, allowanceBytes, usedBytes, remainingBytes]
      properties:
        bundleCount: {type: integer, minimum: 0}
        allowanceBytes: {$ref: '#/components/schemas/UsageBytes'}
        usedBytes: {$ref: '#/components/schemas/UsageBytes'}
        remainingBytes: {$ref: '#/components/schemas/UsageBytes'}
    UsageSnapshot:
      type: object
      required: [customerId, asOf, totals, active, queued, lifetimeAccountedBytes, reservationOutstandingBytes, lastAccountingAt, session, hold, connectivity, accounting, entitlementUpdates]
      properties:
        customerId: {type: string, format: uuid}
        asOf: {type: string, format: date-time}
        totals: {$ref: '#/components/schemas/UsageTotals'}
        active: {$ref: '#/components/schemas/UsageTotals'}
        queued: {$ref: '#/components/schemas/UsageTotals'}
        lifetimeAccountedBytes: {$ref: '#/components/schemas/UsageBytes'}
        reservationOutstandingBytes: {$ref: '#/components/schemas/UsageBytes'}
        lastAccountingAt: {type: [string, 'null'], format: date-time}
        connectivity: {type: string, enum: [none, pending, recent_accounting, stale, uncertain, held]}
        hold:
          type: object
          properties:
            active: {type: boolean}
            reason: {type: [string, 'null']}
            since: {type: [string, 'null'], format: date-time}
        accounting:
          type: object
          properties:
            expectedIntervalSeconds: {type: integer, const: 60}
            staleAfterSeconds: {type: integer, const: 90}
            pollAfterSeconds: {type: integer, const: 5}
        session:
          type: [object, 'null']
          properties:
            grantId: {type: string, format: uuid}
            entitlementId: {type: string, format: uuid}
            siteId: {type: string, format: uuid}
            state: {type: string, enum: [pending, active, uncertain]}
            issuedAt: {type: string, format: date-time}
            deadline: {type: string, format: date-time}
            lastAccountingAt: {type: [string, 'null'], format: date-time}
            reservedBytes: {$ref: '#/components/schemas/UsageBytes'}
            chargedBytes: {$ref: '#/components/schemas/UsageBytes'}
            reservationOutstandingBytes: {$ref: '#/components/schemas/UsageBytes'}
            disconnectRequested: {type: boolean}
            accountingAnomaly: {type: boolean}
            accountingStale: {type: boolean}
            connected: {type: boolean}
        entitlementUpdates:
          type: array
          maxItems: 101
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              consumed_bytes: {$ref: '#/components/schemas/UsageBytes'}
              activated_at: {type: [string, 'null'], format: date-time}
              revoked_at: {type: [string, 'null'], format: date-time}
              start_by: {type: string, format: date-time}
              expires_at: {type: [string, 'null'], format: date-time}
    CashConfirmation:
      type: object
      description: Required for a new agent sale; omitted only to recover a matching historical committed request. Amount/currency must match immutable server terms. Demo retains simulation=true.
      required: [method, confirmed, amountMinor, currency]
      properties:
        method: {type: string, const: cash}
        confirmed: {type: boolean, const: true}
        amountMinor: {type: integer, minimum: 1}
        currency: {type: string}
    RecordedSalePayment:
      type: object
      description: Present on sale/receipt DTOs. Null fields preserve unrecorded historical tender; cash represents an authenticated agent's explicit attestation only.
      properties:
        method: {type: string, enum: [cash, unrecorded]}
        evidence: {type: string, enum: [agent_attestation, unrecorded]}
        receivedMinor: {type: [integer, 'null']}
        currency: {type: [string, 'null']}
        confirmedAt: {type: [string, 'null'], format: date-time}
        confirmedBy: {type: [string, 'null'], format: uuid}
    Reason: {type: string, minLength: 10, maxLength: 500}
    Counter: {type: string, pattern: '^(0|[1-9][0-9]{0,19})$', description: Nonnegative decimal counter; domain validates the unsigned 64-bit bound.}
