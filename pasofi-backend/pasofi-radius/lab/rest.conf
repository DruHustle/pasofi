rest {
 tls {
  ca_info_file = /lab/ca.crt
  certificate_file = /lab/radius.crt
  private_key_file = /lab/radius.key
  check_cert = yes
  check_cert_cn = yes
 }
 authorize {
  uri = "https://radius-api:3443/radius/authorize"
  method = 'post'
  body = 'json'
  tls = ${..tls}
  timeout = 3.0
 }
 accounting {
  uri = "https://radius-api:3443/radius/accounting"
  method = 'post'
  body = 'json'
  tls = ${..tls}
  timeout = 3.0
 }
}
