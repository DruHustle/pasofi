server default {
 listen {
  type = auth
  ipaddr = *
  port = 1812
 }
 listen {
  type = acct
  ipaddr = *
  port = 1813
 }
 authorize {
  update control {
   &REST-HTTP-Header := "X-PamoFi-NAS: %{client:shortname}"
  }
  rest
  if (ok || updated) {
   update control {
    Auth-Type := Accept
   }
  }
  else {
   reject
  }
 }
 accounting {
  update control {
   &REST-HTTP-Header := "X-PamoFi-NAS: %{client:shortname}"
  }
  rest
  if (ok || updated) {
   ok
  }
  else {
   fail
  }
 }
}
