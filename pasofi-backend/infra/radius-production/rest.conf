rest {
 tls {
  ca_info_file = /run/secrets/radius_ca
  certificate_file = /run/secrets/radius_client_cert
  private_key_file = /run/secrets/radius_client_key
  check_cert = yes
  check_cert_cn = yes
 }
 authorize {
  uri = "https://radius-api:3443/radius/authorize"
  method = 'post'
  body = 'json'
  tls = ${..tls}
  timeout = 3.0
 }
 accounting {
  uri = "https://radius-api:3443/radius/accounting"
  method = 'post'
  body = 'json'
  tls = ${..tls}
  timeout = 3.0
 }
}
