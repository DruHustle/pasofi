# Optional Render HTTPS email transport; use instead of invoice-delivery.compose.yaml.
# The Oracle notification queue, private PDF lookup, SMS and all payment gates stay here.
services:
  notification:
    environment:
      INVOICE_DELIVERY_WORKER_ENABLED: ${PAMOFI_INVOICE_DELIVERY_ENABLED:?Choose true or false explicitly}
      INVOICE_EMAIL_MODE: resend
      INVOICE_EMAIL_TRANSPORT: render
      INVOICE_EMAIL_QUALIFIED: ${PAMOFI_INVOICE_EMAIL_QUALIFIED:?Record actual sender and delivery qualification}
      INVOICE_EMAIL_FROM: 'PasoFi <notifications-pasofi@onesa.eu>'
      INVOICE_EMAIL_RELAY_QUALIFIED: ${PAMOFI_INVOICE_EMAIL_RELAY_QUALIFIED:?Record the qualified relay revision and contract}
      INVOICE_EMAIL_RELAY_URL: ${PAMOFI_INVOICE_EMAIL_RELAY_URL:?Set the exact qualified HTTPS onrender.com origin}
      INVOICE_EMAIL_RELAY_SECRET_FILE: /run/secrets/invoice_email_relay_secret
    secrets:
      - invoice_email_relay_secret
    networks:
      - invoice_relay_egress
secrets:
  invoice_email_relay_secret:
    file: ${PAMOFI_SECRETS_DIR:?Set the absolute protected secret directory}/invoice_email_relay_secret
networks:
  invoice_relay_egress:
    external: true
    name: ${PAMOFI_INVOICE_RELAY_EGRESS_NETWORK:?Set the existing separately restricted HTTPS relay egress network}
