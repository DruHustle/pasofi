# Optional same-origin customer entry on the dedicated gateway IP. The ordinary
# /api/ route continues to require Vercel's private proxy credential.
location = / { root /opt/pasofi/hotspot-web; try_files /index.html =404; }
location = /connect { root /opt/pasofi/hotspot-web; try_files /index.html =404; }
location = /handoff { root /opt/pasofi/hotspot-web; try_files /index.html =404; }
# Browser and home-screen icons are public static files, never API proxy routes.
location = /favicon.svg { root /opt/pasofi/hotspot-web; try_files $uri =404; }
location = /favicon.ico { root /opt/pasofi/hotspot-web; try_files $uri =404; }
location = /apple-touch-icon.png { root /opt/pasofi/hotspot-web; try_files $uri =404; }
location /assets/ { root /opt/pasofi/hotspot-web; try_files $uri =404; }
location /images/ { root /opt/pasofi/hotspot-web; try_files $uri =404; }
location /portal-api/ {
  # Browser traffic cannot nominate its client IP. The server-level real-IP
  # module may have parsed an attacker header; use the original socket peer.
  set $web web;
  rewrite ^/portal-api/(.*)$ /api/$1 break;
  proxy_pass http://$web:80;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $realip_remote_addr;
  proxy_set_header X-Real-IP $realip_remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Forwarded "";
  proxy_set_header X-Vercel-Forwarded-For "";
  proxy_set_header X-PamoFi-Proxy-Token "";
  proxy_set_header X-PamoFi-Client-IP "";
  proxy_set_header Connection "";
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;
  proxy_send_timeout 15s;
}
