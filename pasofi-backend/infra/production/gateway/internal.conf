# This listener has no host port. Each virtual host exposes only its service's
# authenticated internal contract; unknown paths never reach an application.
server {
 listen 443 ssl default_server;
 server_name _;
 include /etc/nginx/pamofi/internal-common.conf;
 return 404;
}
server {
 listen 443 ssl;
 server_name identity.internal;
 include /etc/nginx/pamofi/internal-common.conf;
 location ~ ^/internal/v1/(session|staff/(session|users/[0-9a-fA-F-]+))$ { set $service identity; proxy_pass http://$service:3000; }
 location / { return 404; }
}
server {
 listen 443 ssl;
 server_name prepaid.internal;
 include /etc/nginx/pamofi/internal-common.conf;
 location ~ ^/internal/v1/(radius/(grants|accounting|restart|reconcile(?:/pending)?)|deliveries/[0-9a-fA-F-]+|invoices/[0-9a-fA-F-]+(?:/pdf)?)$ { set $service prepaid-access; proxy_pass http://$service:3000; }
 location / { return 404; }
}
server {
 listen 443 ssl;
 server_name network.internal;
 include /etc/nginx/pamofi/internal-common.conf;
 location ~ ^/internal/v1/network/(sites|credentials)$ { set $service network; proxy_pass http://$service:3000; }
 location ~ "^/internal/v1/router-fleet/routers(?:/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:/changes(?:/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:/(?:apply|reconcile|rollback))?)?)?)?$" { set $service network; proxy_read_timeout 35s; proxy_pass http://$service:3000; }
 location / { return 404; }
}
server {
 listen 443 ssl;
 server_name notification.internal;
 include /etc/nginx/pamofi/internal-common.conf;
 location ~ ^/internal/v1/(events|delivery/capabilities|deliveries/[0-9a-fA-F-]+/(status|resend)|invoice-delivery/capabilities|invoices/[0-9a-fA-F-]+/status)$ { set $service notification; proxy_pass http://$service:3000; }
 location / { return 404; }
}
